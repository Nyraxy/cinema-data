name: Update cinema data

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay scheduled runs a bit.
    - cron: "7 */3 * * *"
    # Extra runs every 20 min on Monday evening (18:00-23:00 Brussels), until Pathé's new week is in
    - cron: "10,30,50 16-21 * * 1"
  push:
    paths: ["letterboxd-export/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unpack a newly uploaded Letterboxd export
        run: |
          zip=$(ls -t letterboxd-export/*.zip 2>/dev/null | head -1 || true)
          if [ -n "$zip" ]; then
            unzip -o -q "$zip" -d letterboxd-export
            git rm -q --cached letterboxd-export/*.zip || true
            rm -f letterboxd-export/*.zip
          fi
          # keep only what the scraper needs (the repo is public)
          find letterboxd-export -type f ! -name README.md ! -path letterboxd-export/watched.csv \
            ! -path letterboxd-export/ratings.csv ! -path letterboxd-export/likes/films.csv -delete
          find letterboxd-export -type d -empty -delete
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chrome
      - run: xvfb-run -a node scrape.mjs
      - name: Commit data
        run: |
          git config user.name "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add -A data letterboxd-export
          git diff --cached --quiet || git commit -m "Update cinema data"
          git pull --rebase -X theirs -q && git push
