name: Update cinema data

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay scheduled runs a bit.
    - cron: "7 */3 * * *"
    # Extra runs on Monday evening, after Pathé publishes next week's schedule (18:00 Brussels)
    - cron: "20,50 17 * * 1"
  push:
    paths: ["letterboxd-export/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unpack a newly uploaded Letterboxd export
        run: |
          zip=$(ls -t letterboxd-export/*.zip 2>/dev/null | head -1 || true)
          if [ -n "$zip" ]; then
            unzip -o -q "$zip" -d letterboxd-export
            git rm -q --cached letterboxd-export/*.zip || true
            rm -f letterboxd-export/*.zip
          fi
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chrome
      - run: xvfb-run -a node scrape.mjs
      - name: Commit data
        run: |
          git config user.name "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add -A data letterboxd-export
          git diff --cached --quiet || git commit -m "Update cinema data"
          git pull --rebase -X theirs -q && git push
      - name: Publish cinema.json to the public feed repo (read by the daily Claude task)
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          if [ -z "$FEED_TOKEN" ]; then echo "FEED_TOKEN not set, skipping"; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:${FEED_TOKEN}@github.com/Nyraxy/cinema-feed.git" /tmp/feed || \
            (mkdir -p /tmp/feed && cd /tmp/feed && git init -q -b main && git remote add origin "https://x-access-token:${FEED_TOKEN}@github.com/Nyraxy/cinema-feed.git")
          cp data/cinema.json /tmp/feed/cinema.json
          cd /tmp/feed
          [ -f README.md ] || printf '# cinema-feed\n\nPublished automatically by Nyraxy/cinema-data. Showtimes plus public Letterboxd watchlist/ratings.\n' > README.md
          git config user.name "cinema-bot"
          git config user.email "cinema-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Update feed"
          git push -q origin HEAD:main
