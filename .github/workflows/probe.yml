name: Probe sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          scan() { t=$(curl -s -A "$UA" -m 20 "https://cinebel.dhnet.be/theater/$1" | grep -o '<title>[^<]*' | head -1); [ -n "$t" ] && echo "$1 $t"; }
          export -f scan; export UA
          seq 600 1300 | xargs -P 6 -I{} bash -c 'scan {}' | sort -n > probe/cinebel-ids.txt
          wc -l probe/cinebel-ids.txt
      - run: |
          git config user.name cinema-bot; git config user.email cinema-bot@users.noreply.github.com
          git add probe && git commit -m "probe ids" && git push
